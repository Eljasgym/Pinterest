name: Pins einplanen

on:
  schedule:
    - cron: "17 */4 * * *"   # alle 4 Stunden, Buffer Free hält nur 10 Pins pro Account
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur anzeigen, nichts einplanen"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: pins
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Einplanen
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 poster.py ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
      - name: Stand speichern
        run: |
          git config user.name "pin-bot"
          git config user.email "pin-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Pins eingeplant" && git push)
